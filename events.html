<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events – CampusOS</title>
  <meta name="description" content="Discover and RSVP for clubs and events at City University.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: {
        brand: { 50:'#eef4ff', 100:'#dce9ff', 500:'#2563eb', 600:'#1d4ed8', 700:'#1e40af' },
        accent: '#f59e0b', ink: '#0f172a', muted: '#64748b', surface: '#f8fafc'
      },
      fontFamily: { sans: ['Inter','system-ui','sans-serif'] },
      animation: { 'slide-up': 'slideUp 0.3s ease', 'scale-in': 'scaleIn 0.2s ease' },
      keyframes: {
        slideUp: { '0%':{ opacity:0, transform:'translateY(10px)' }, '100%':{ opacity:1, transform:'translateY(0)' } },
        scaleIn: { '0%':{ opacity:0, transform:'scale(0.95)' }, '100%':{ opacity:1, transform:'scale(1)' } },
      }
    }}}
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  </style>
</head>
<body class="flex min-h-screen flex-col bg-surface text-ink">
  <div id="navbar"></div>

  <main class="max-w-7xl mx-auto w-full flex-1 px-4 sm:px-6 lg:px-8 py-8">
    <!-- Page header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-ink">Events</h1>
        <p class="text-muted mt-1">Discover what's happening across City University</p>
      </div>
      <button id="new-event-btn" class="hidden bg-brand-600 text-white font-bold px-5 py-2.5 rounded-xl hover:bg-brand-700 transition flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"/></svg>
        New Event
      </button>
    </div>

    <!-- Filters bar -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-6">
      <div class="flex flex-col sm:flex-row gap-3">
        <!-- Search -->
        <div class="relative flex-1">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 105 11a6 6 0 0012 0z"/></svg>
          <input id="search-input" type="search" placeholder="Search events…"
            class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
        </div>
        <!-- Club filter -->
        <select id="filter-club" class="px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm bg-white min-w-[150px]">
          <option value="">All Clubs</option>
        </select>
        <!-- Type filter -->
        <select id="filter-type" class="px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm bg-white min-w-[140px]">
          <option value="">All Types</option>
          <option value="workshop">Workshop</option>
          <option value="seminar">Seminar</option>
          <option value="competition">Competition</option>
          <option value="cultural">Cultural</option>
          <option value="sports">Sports</option>
          <option value="social">Social</option>
          <option value="general">General</option>
        </select>
      </div>

      <!-- Range tabs -->
      <div class="flex gap-1 mt-3 bg-slate-100 rounded-xl p-1">
        <button data-range="upcoming" class="flex-1 py-1.5 rounded-lg text-sm font-semibold transition bg-brand-600 text-white">Upcoming</button>
        <button data-range="week"     class="flex-1 py-1.5 rounded-lg text-sm font-semibold transition bg-white text-muted">This week</button>
        <button data-range="past"     class="flex-1 py-1.5 rounded-lg text-sm font-semibold transition bg-white text-muted">Past</button>
        <button data-range="all"      class="flex-1 py-1.5 rounded-lg text-sm font-semibold transition bg-white text-muted">All</button>
      </div>
    </div>

    <!-- Events grid -->
    <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Populated by events.js -->
    </div>
  </main>

  <footer class="mt-8 bg-[#00005A] py-12 text-white">
    <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-4 px-4 sm:px-6 md:flex-row lg:px-8">
      <div class="inline-flex h-32 w-56 items-center justify-center overflow-hidden rounded-[50%] border-2 border-[#b42332] bg-white p-3 shadow-lg sm:h-36 sm:w-64 md:h-40 md:w-72">
        <img src="CityUniLogo.jpeg" alt="City University" class="h-full w-full object-contain">
      </div>
      <p class="text-center text-sm text-slate-400">Built for City University (CPCCU Hackathon 2). Replace scattered chats with one platform.</p>
    </div>
  </footer>

  <div id="toast-root" class="fixed bottom-4 right-4 z-[200] max-w-sm w-full"></div>
  <div id="modal-overlay" class="fixed inset-0 z-[100] items-center justify-center p-4 bg-ink/50 backdrop-blur-sm" style="display:none"></div>

  <script type="module">
    import { renderNavbar, requireAuth, toast, skeletonCards, emptyState, escapeHtml, formatDateTime, debounce, openModal, closeModal } from './js/app.js';
    import { listClubs, listEvents, getRsvpCounts, getMyRsvps, createEvent, deleteEvent, getProfile } from './js/api.js';

    // Make closeModal globally accessible for inline onclick handlers
    window.AppModule = { closeModal };

    let _profile = null, _clubs = [], _rsvpIds = new Set(), _counts = {}, _filters = { search:'', clubId:'', type:'', range:'upcoming' };

    async function init() {
      renderNavbar();
      try { await requireAuth(); } catch { return; }

      _profile = await getProfile();
      const isAdmin = _profile?.role === 'admin';

      if (isAdmin) {
        const btn = document.getElementById('new-event-btn');
        btn.classList.remove('hidden');
        btn.addEventListener('click', openCreateModal);
      }

      [_clubs, _counts] = await Promise.all([listClubs(), getRsvpCounts()]);

      const clubSel = document.getElementById('filter-club');
      clubSel.innerHTML = '<option value="">All Clubs</option>' +
        _clubs.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

      const myRsvps = await getMyRsvps();
      _rsvpIds = new Set(myRsvps.map(r => r.event_id));

      document.getElementById('search-input').addEventListener('input', debounce(e => { _filters.search = e.target.value; loadEvents(); }, 300));
      document.getElementById('filter-club').addEventListener('change', e => { _filters.clubId = e.target.value; loadEvents(); });
      document.getElementById('filter-type').addEventListener('change', e => { _filters.type   = e.target.value; loadEvents(); });

      document.querySelectorAll('[data-range]').forEach(btn => {
        btn.addEventListener('click', () => {
          _filters.range = btn.dataset.range;
          document.querySelectorAll('[data-range]').forEach(b => {
            b.className = b === btn
              ? 'flex-1 py-1.5 rounded-lg text-sm font-semibold transition bg-brand-600 text-white'
              : 'flex-1 py-1.5 rounded-lg text-sm font-semibold transition bg-white text-muted';
          });
          loadEvents();
        });
      });

      loadEvents();
    }

    async function loadEvents() {
      const grid = document.getElementById('events-grid');
      grid.innerHTML = skeletonCards(6);
      try {
        const events = await listEvents(_filters);
        renderEvents(events);
      } catch (err) {
        toast('Failed to load events: ' + err.message, 'error');
        grid.innerHTML = emptyState({ icon:'⚠️', title:'Error loading events', text: err.message });
      }
    }

    function renderEvents(events) {
      const grid    = document.getElementById('events-grid');
      const isAdmin = _profile?.role === 'admin';

      if (!events.length) {
        grid.innerHTML = emptyState({ icon:'📅', title:'No events found', text:'Try adjusting your filters, or check back soon.' });
        return;
      }

      grid.innerHTML = events.map(ev => {
        const d        = new Date(ev.starts_at);
        const isPast   = d < new Date();
        const going    = _counts[ev.id] || 0;
        const rsvped   = _rsvpIds.has(ev.id);
        const seatsLeft= ev.capacity != null ? ev.capacity - going : null;
        const full     = seatsLeft !== null && seatsLeft <= 0;

        return `
          <article class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 group flex flex-col">
            <div class="bg-gradient-to-r from-brand-600 to-brand-500 px-5 pt-4 pb-3 flex items-start justify-between">
              <div class="text-white">
                <div class="text-2xl font-black leading-none">${d.getDate().toString().padStart(2,'0')}</div>
                <div class="text-xs font-semibold uppercase tracking-wider opacity-80">${d.toLocaleString('en-GB',{month:'short'})}</div>
                <div class="text-xs opacity-70">${d.toLocaleString('en-GB',{year:'numeric'})}</div>
              </div>
              <div class="flex flex-col items-end gap-1">
                <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-white/20 text-white capitalize">${escapeHtml(ev.type)}</span>
                ${rsvped ? '<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-accent text-white">✓ Registered</span>' : ''}
                ${full && !rsvped ? '<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-red-200 text-red-700">Full</span>' : ''}
              </div>
            </div>
            <div class="p-5 flex-1 flex flex-col">
              <h3 class="font-bold text-ink text-lg mb-1 group-hover:text-brand-600 transition-colors line-clamp-2">
                <a href="event.html?id=${ev.id}">${escapeHtml(ev.title)}</a>
              </h3>
              <p class="text-xs text-muted font-medium mb-3">🏛️ ${escapeHtml(ev.club_name)}</p>
              <div class="space-y-1 text-xs text-muted mb-4 flex-1">
                <div>📍 ${escapeHtml(ev.venue)}</div>
                <div>🕐 ${formatDateTime(ev.starts_at)}</div>
                <div>👥 ${going} going${seatsLeft !== null ? ` · ${seatsLeft} seats left` : ''}</div>
              </div>
              <div class="flex items-center gap-2 mt-auto">
                <a href="event.html?id=${ev.id}" class="flex-1 text-center bg-brand-600 text-white text-sm font-semibold py-2 rounded-lg hover:bg-brand-700 transition">
                  ${rsvped ? 'View Pass' : isPast ? 'View Details' : 'See Details'}
                </a>
                ${isAdmin ? `
                  <button onclick="handleDelete('${ev.id}','${escapeHtml(ev.title).replace(/'/g,"\\'")}',this)"
                    class="p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition" title="Delete event">
                    🗑️
                  </button>` : ''}
              </div>
            </div>
          </article>`;
      }).join('');
    }

    function openCreateModal() {
      const clubOptions = _clubs.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      openModal(`
        <div class="p-6">
          <h2 class="text-xl font-bold text-ink mb-5">Create New Event</h2>
          <form id="create-event-form" class="space-y-4" novalidate>
            <div>
              <label class="block text-xs font-semibold uppercase text-muted mb-1">Club *</label>
              <select id="ce-club" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm bg-white" required>
                <option value="">Select a club</option>${clubOptions}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-muted mb-1">Title *</label>
              <input id="ce-title" type="text" placeholder="Event title" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm" required>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-muted mb-1">Description</label>
              <textarea id="ce-desc" rows="3" placeholder="What's this event about?" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm resize-none"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold uppercase text-muted mb-1">Type</label>
                <select id="ce-type" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm bg-white">
                  ${['workshop','seminar','competition','cultural','sports','social','general'].map(t=>`<option value="${t}">${t.charAt(0).toUpperCase()+t.slice(1)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase text-muted mb-1">Capacity</label>
                <input id="ce-capacity" type="number" min="1" placeholder="Unlimited if blank" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold uppercase text-muted mb-1">Date &amp; Time *</label>
                <input id="ce-datetime" type="datetime-local" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm" required>
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase text-muted mb-1">Venue *</label>
                <input id="ce-venue" type="text" placeholder="e.g. Auditorium" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm" required>
              </div>
            </div>
            <p id="ce-error" class="text-red-500 text-xs bg-red-50 rounded-lg p-2 hidden"></p>
            <div class="flex gap-3 pt-2">
              <button type="button" id="ce-cancel" class="flex-1 border border-slate-200 text-ink font-semibold py-2.5 rounded-xl hover:bg-slate-50 transition text-sm">Cancel</button>
              <button id="ce-submit" type="submit" class="flex-1 bg-brand-600 text-white font-bold py-2.5 rounded-xl hover:bg-brand-700 transition text-sm">Create Event</button>
            </div>
          </form>
        </div>`);

      document.getElementById('ce-cancel').addEventListener('click', closeModal);
      document.getElementById('create-event-form').addEventListener('submit', async e => {
        e.preventDefault();
        const club_id     = document.getElementById('ce-club').value;
        const title       = document.getElementById('ce-title').value.trim();
        const description = document.getElementById('ce-desc').value.trim();
        const type        = document.getElementById('ce-type').value;
        const cap         = document.getElementById('ce-capacity').value;
        const starts_at   = document.getElementById('ce-datetime').value;
        const venue       = document.getElementById('ce-venue').value.trim();
        const errEl       = document.getElementById('ce-error');
        errEl.classList.add('hidden');

        if (!club_id || !title || !starts_at || !venue) {
          errEl.textContent = 'Please fill in all required fields.';
          errEl.classList.remove('hidden');
          return;
        }
        const btn = document.getElementById('ce-submit');
        btn.disabled = true; btn.textContent = 'Creating…';
        try {
          const ev = await createEvent({ club_id, title, description, type, starts_at: new Date(starts_at).toISOString(), venue, capacity: cap ? parseInt(cap) : null });
          closeModal();
          toast('Event created! 🎉', 'success');
          _counts[ev.id] = 0;
          loadEvents();
        } catch (err) {
          errEl.textContent = err.message;
          errEl.classList.remove('hidden');
          btn.disabled = false; btn.textContent = 'Create Event';
        }
      });
    }

    window.handleDelete = (id, title) => {
      openModal(`
        <div class="p-6 text-center">
          <div class="text-4xl mb-3">🗑️</div>
          <h2 class="text-xl font-bold text-ink mb-2">Delete event?</h2>
          <p class="text-muted mb-6">Delete <strong>${escapeHtml(title)}</strong>? This cannot be undone.</p>
          <div class="flex gap-3">
            <button id="del-cancel" class="flex-1 border border-slate-200 text-ink font-semibold py-2.5 rounded-xl hover:bg-slate-50 transition">Cancel</button>
            <button id="del-confirm" class="flex-1 bg-red-600 text-white font-bold py-2.5 rounded-xl hover:bg-red-700 transition">Delete</button>
          </div>
        </div>`);
      document.getElementById('del-cancel').addEventListener('click', closeModal);
      document.getElementById('del-confirm').addEventListener('click', async () => {
        try {
          await deleteEvent(id);
          closeModal();
          toast('Event deleted.', 'info');
          loadEvents();
        } catch (err) {
          toast('Failed: ' + err.message, 'error');
        }
      });
    };

    init();
  </script>
</body>
</html>
