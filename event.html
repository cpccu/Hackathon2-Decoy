<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Detail – CampusOS</title>
  <meta name="description" content="Event details, RSVP, and your QR pass on CampusOS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: {
        brand: { 50:'#eef4ff', 500:'#2563eb', 600:'#1d4ed8', 700:'#1e40af' },
        accent: '#f59e0b', ink: '#0f172a', muted: '#64748b', surface: '#f8fafc'
      },
      fontFamily: { sans: ['Inter','system-ui','sans-serif'] },
      animation: { 'scale-in': 'scaleIn 0.2s ease', 'slide-up': 'slideUp 0.3s ease' },
      keyframes: {
        scaleIn: { '0%':{ opacity:0, transform:'scale(0.95)' }, '100%':{ opacity:1, transform:'scale(1)' } },
        slideUp: { '0%':{ opacity:0, transform:'translateY(10px)' }, '100%':{ opacity:1, transform:'translateY(0)' } },
      }
    }}}
  </script>
  <!-- QR code generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex min-h-screen flex-col bg-surface text-ink">
  <div id="navbar"></div>

  <main class="max-w-4xl mx-auto w-full flex-1 px-4 pb-24 pt-8 sm:px-6 sm:pb-8 lg:px-8">
    <div id="content">
      <!-- Skeleton -->
      <div class="animate-pulse space-y-4">
        <div class="h-8 bg-slate-200 rounded w-1/2"></div>
        <div class="h-4 bg-slate-200 rounded w-1/3"></div>
        <div class="bg-white rounded-2xl p-6 space-y-3">
          <div class="h-4 bg-slate-200 rounded w-3/4"></div>
          <div class="h-4 bg-slate-200 rounded w-1/2"></div>
          <div class="h-4 bg-slate-200 rounded w-2/3"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="mt-8 bg-[#00005A] py-12 pb-28 text-white sm:pb-12">
    <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-4 px-4 sm:px-6 md:flex-row lg:px-8">
      <div class="inline-flex h-32 w-56 items-center justify-center overflow-hidden rounded-[50%] border-2 border-[#b42332] bg-white p-3 shadow-lg sm:h-36 sm:w-64 md:h-40 md:w-72">
        <img src="CityUniLogo.jpeg" alt="City University" class="h-full w-full object-contain">
      </div>
      <p class="text-center text-sm text-slate-400">Built for City University (CPCCU Hackathon 2)</p>
    </div>
  </footer>

  <!-- Sticky RSVP bar (mobile) -->
  <div id="sticky-bar" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 z-40 sm:hidden">
    <button id="rsvp-btn-mobile" class="w-full bg-brand-600 text-white font-bold py-3 rounded-xl hover:bg-brand-700 transition">
      RSVP to this Event
    </button>
  </div>

  <div id="toast-root" class="fixed bottom-4 right-4 z-[200] max-w-sm w-full"></div>
  <div id="modal-overlay" class="fixed inset-0 z-[100] items-center justify-center p-4 bg-ink/50 backdrop-blur-sm" style="display:none"></div>

  <script type="module">
    import { renderNavbar, requireAuth, toast, escapeHtml, formatDateTime, timeAgo, openModal, closeModal } from './js/app.js';
    import { getEvent, getRsvpCounts, getMyRsvpForEvent, getEventRegistrants, getManagedClubIds, createRsvp, cancelRsvp, getProfile } from './js/api.js';

    window.AppModule = { closeModal };

    const eventId = new URLSearchParams(location.search).get('id');

    async function init() {
      renderNavbar();
      try { await requireAuth(); } catch { return; }

      if (!eventId) { showNotFound(); return; }

      const [event, counts, profile] = await Promise.all([
        getEvent(eventId), getRsvpCounts(), getProfile()
      ]);

      if (!event) { showNotFound(); return; }

      const isAdmin = profile?.role === 'admin';
      let canManageEvent = false;
      let myRsvp = null;
      let registrants = [];
      let registrantError = '';
      if (isAdmin) {
        const managedClubIds = await getManagedClubIds();
        canManageEvent = profile.is_super_admin || managedClubIds.includes(event.club_id);
        if (canManageEvent) {
          try {
            registrants = await getEventRegistrants(event.id);
          } catch (error) {
            registrantError = error.message;
            toast(`Failed to load registrations: ${error.message}`, 'error');
          }
        }
      } else {
        myRsvp = await getMyRsvpForEvent(event.id);
      }

      renderEvent(event, counts, myRsvp, profile, registrants, canManageEvent, registrantError);
    }

    function showNotFound() {
      document.getElementById('content').innerHTML = `
        <div class="text-center py-24">
          <div class="text-6xl mb-4">🔍</div>
          <h1 class="text-2xl font-bold text-ink mb-2">Event not found</h1>
          <p class="text-muted mb-6">This event doesn't exist or has been removed.</p>
          <a href="events.html" class="bg-brand-600 text-white font-semibold px-6 py-3 rounded-xl hover:bg-brand-700 transition">Back to Events</a>
        </div>`;
    }

    function renderEvent(event, counts, myRsvp, profile, registrants, canManageEvent, registrantError) {
      const d        = new Date(event.starts_at);
      const isPast   = d < new Date();
      const going    = counts[event.id] || 0;
      const seatsLeft= event.capacity != null ? event.capacity - going : null;
      const full     = seatsLeft !== null && seatsLeft <= 0 && !myRsvp;
      const checkedIn = myRsvp?.checked_in_at;

      document.title = `${event.title} – CampusOS`;

      document.getElementById('content').innerHTML = `
        <!-- Breadcrumb -->
        <nav class="flex items-center gap-2 text-sm text-muted mb-6">
          <a href="events.html" class="hover:text-brand-600 transition">Events</a>
          <span>›</span>
          <span class="text-ink font-medium truncate">${escapeHtml(event.title)}</span>
        </nav>

        <!-- Banner -->
        <div class="bg-gradient-to-r from-brand-700 to-brand-500 rounded-3xl p-8 text-white mb-6 relative overflow-hidden">
          <div class="absolute inset-0 bg-black/10"></div>
          <div class="relative z-10">
            <span class="inline-block bg-white/20 text-white text-xs font-semibold px-3 py-1 rounded-full mb-3 capitalize">${escapeHtml(event.type)}</span>
            <h1 class="text-3xl md:text-4xl font-extrabold mb-2">${escapeHtml(event.title)}</h1>
            <p class="text-blue-100 text-lg font-medium">🏛️ ${escapeHtml(event.club_name)}</p>
          </div>
        </div>

        <div class="grid md:grid-cols-3 gap-6">
          <!-- Details -->
          <div class="md:col-span-2 space-y-4">
            <!-- Info card -->
            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
              <h2 class="font-bold text-ink text-lg mb-4">Event Details</h2>
              <div class="space-y-3">
                <div class="flex items-start gap-3">
                  <span class="text-xl">📅</span>
                  <div>
                    <div class="font-semibold text-ink">${formatDateTime(event.starts_at)}</div>
                    <div class="text-muted text-sm">${isPast ? 'This event has passed' : 'Coming up'}</div>
                  </div>
                </div>
                <div class="flex items-start gap-3">
                  <span class="text-xl">📍</span>
                  <div>
                    <div class="font-semibold text-ink">${escapeHtml(event.venue)}</div>
                    <div class="text-muted text-sm">Venue</div>
                  </div>
                </div>
                <div class="flex items-start gap-3">
                  <span class="text-xl">🏛️</span>
                  <div>
                    <div class="font-semibold text-ink">${escapeHtml(event.club_name)}</div>
                    <div class="text-muted text-sm">Hosted by</div>
                  </div>
                </div>
                ${event.department_name ? `
                  <div class="flex items-start gap-3">
                    <span class="text-xl">🎓</span>
                    <div>
                      <div class="font-semibold text-ink">${escapeHtml(event.department_name)}</div>
                      <div class="text-muted text-sm">Department</div>
                    </div>
                  </div>` : ''}
                <div class="flex items-start gap-3">
                  <span class="text-xl">👥</span>
                  <div>
                    <div class="font-semibold text-ink">${going} going${seatsLeft !== null ? ` · ${seatsLeft} seats left` : ' · Unlimited capacity'}</div>
                    <div class="text-muted text-sm">Attendance</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Description -->
            ${event.description ? `
              <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
                <h2 class="font-bold text-ink text-lg mb-3">About this Event</h2>
                <p class="text-muted leading-relaxed">${escapeHtml(event.description)}</p>
              </div>` : ''}
          </div>

          <!-- RSVP / admin sidebar -->
          <div class="space-y-4">
            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 sticky top-20">
              ${profile?.role === 'admin' ? `
                <div class="text-center">
                  <div class="text-4xl mb-2">🛠️</div>
                  <p class="font-bold text-ink mb-1">Admin account</p>
                  <p class="text-muted text-sm">${canManageEvent ? 'Review the student registrations below.' : 'Admins cannot register for events.'}</p>
                </div>
              ` : !myRsvp ? `
                ${full ? `
                  <div class="text-center">
                    <div class="text-4xl mb-2">😔</div>
                    <p class="font-bold text-ink mb-1">Event is Full</p>
                    <p class="text-muted text-sm">No seats left for this event.</p>
                  </div>
                ` : isPast ? `
                  <div class="text-center">
                    <div class="text-4xl mb-2">⏰</div>
                    <p class="font-bold text-ink mb-1">Event has ended</p>
                    <p class="text-muted text-sm">RSVP is no longer available.</p>
                  </div>
                ` : `
                  <p class="text-muted text-sm mb-4">Secure your spot at this event.</p>
                  <button id="rsvp-btn" class="w-full bg-brand-600 text-white font-bold py-3 rounded-xl hover:bg-brand-700 transition flex items-center justify-center gap-2">
                    🎟️ RSVP Now
                  </button>
                `}
              ` : `
                <div class="text-center mb-4">
                  <div class="text-4xl mb-2">${checkedIn ? '✅' : '🎟️'}</div>
                  <p class="font-bold text-ink mb-1">${checkedIn ? 'Checked In' : 'You\'re Registered!'}</p>
                  ${checkedIn ? `<p class="text-muted text-xs">Checked in ${timeAgo(checkedIn)}</p>` : ''}
                </div>
                <button id="view-pass-btn" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 transition mb-3">
                  📲 View My Pass
                </button>
                ${!checkedIn ? `<button id="cancel-rsvp-btn" class="w-full text-red-500 text-sm font-medium hover:text-red-700 hover:underline transition py-1">Cancel RSVP</button>` : ''}
              `}
            </div>
          </div>
        </div>`;

      if (profile?.role === 'admin' && canManageEvent) {
        document.getElementById('content').insertAdjacentHTML('beforeend', `
          <section class="mt-6 bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
            <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-2 mb-4">
              <div>
                <h2 class="font-bold text-ink text-lg">Student registrations</h2>
                <p class="text-muted text-sm">Student details are taken from their account profiles.</p>
              </div>
              <span class="text-sm font-semibold text-brand-700">${registrants.length} registered</span>
            </div>
            ${registrantError ? `
              <p class="rounded-xl bg-red-50 p-4 text-sm text-red-700">Could not load registrations: ${escapeHtml(registrantError)}</p>
            ` : registrants.length ? `
              <div class="divide-y divide-slate-100">
                ${registrants.map(student => `
                  <div class="flex flex-col gap-1 py-3 sm:flex-row sm:items-center sm:justify-between">
                    <span class="font-semibold text-ink">${escapeHtml(student.full_name)}</span>
                    <span class="text-sm text-muted">Student ID: <span class="font-mono text-ink">${escapeHtml(student.student_id || 'Not provided')}</span></span>
                  </div>`).join('')}
              </div>
            ` : '<p class="rounded-xl bg-slate-50 p-4 text-sm text-muted">No students have registered yet.</p>'}
          </section>`);
      }

      // Wire up RSVP buttons
      const rsvpBtn = document.getElementById('rsvp-btn');
      if (rsvpBtn) {
        rsvpBtn.addEventListener('click', () => handleRsvp(event, profile));
      }

      const viewPassBtn = document.getElementById('view-pass-btn');
      if (viewPassBtn && myRsvp) {
        viewPassBtn.addEventListener('click', () => openPassModal(event, myRsvp, profile));
      }

      const cancelBtn = document.getElementById('cancel-rsvp-btn');
      if (cancelBtn && myRsvp) {
        cancelBtn.addEventListener('click', () => handleCancelRsvp(myRsvp.id));
      }

      // Sticky mobile RSVP
      if (profile?.role !== 'admin' && !myRsvp && !full && !isPast) {
        document.getElementById('sticky-bar').classList.remove('hidden');
        document.getElementById('rsvp-btn-mobile').addEventListener('click', () => handleRsvp(event, profile));
      }
    }

    async function handleRsvp(event, profile) {
      if (profile?.role !== 'student') {
        toast('Only students can register for events.', 'error');
        return;
      }
      const btn = document.getElementById('rsvp-btn') || document.getElementById('rsvp-btn-mobile');
      if (btn) { btn.disabled = true; btn.textContent = 'Registering…'; }
      try {
        await createRsvp(event.id);
        toast('You\'re registered! 🎉', 'success');
        setTimeout(() => location.reload(), 800);
      } catch (err) {
        if (err.code === '23505') {
          toast('You\'re already registered for this event.', 'warning');
        } else if (err.message?.includes('full') || err.message?.includes('Full')) {
          toast('Sorry, this event is full!', 'error');
        } else {
          toast(err.message, 'error');
        }
        if (btn) { btn.disabled = false; btn.textContent = '🎟️ RSVP Now'; }
      }
    }

    async function handleCancelRsvp(rsvpId) {
      openModal(`
        <div class="p-6 text-center">
          <div class="text-4xl mb-3">❌</div>
          <h2 class="text-xl font-bold text-ink mb-2">Cancel RSVP?</h2>
          <p class="text-muted mb-6">Your spot will be released and your pass will be invalid.</p>
          <div class="flex gap-3">
            <button id="cancel-no" class="flex-1 border border-slate-200 text-ink font-semibold py-2.5 rounded-xl hover:bg-slate-50 transition">Keep RSVP</button>
            <button id="cancel-yes" class="flex-1 bg-red-600 text-white font-bold py-2.5 rounded-xl hover:bg-red-700 transition">Cancel RSVP</button>
          </div>
        </div>`);
      document.getElementById('cancel-no').addEventListener('click', closeModal);
      document.getElementById('cancel-yes').addEventListener('click', async () => {
        try {
          await cancelRsvp(rsvpId);
          closeModal();
          toast('RSVP cancelled.', 'info');
          setTimeout(() => location.reload(), 800);
        } catch (err) {
          toast(err.message, 'error');
        }
      });
    }

    function openPassModal(event, rsvp, profile) {
      const isCheckedIn = !!rsvp.checked_in_at;
      openModal(`
        <div class="p-6">
          <h2 class="text-xl font-bold text-ink mb-1 text-center">My Event Pass</h2>
          <p class="text-muted text-sm text-center mb-5">Show this at the door for check-in</p>

          <!-- QR code -->
          <div class="flex justify-center mb-5">
            <div class="bg-white border-4 border-brand-100 rounded-2xl p-3 shadow-sm">
              <div id="qr-code" aria-label="Event pass QR code"></div>
            </div>
          </div>
          <p id="qr-error" class="hidden text-center text-sm text-red-600 mb-4" role="alert"></p>

          <!-- Pass info -->
          <div class="bg-surface rounded-2xl p-4 space-y-2 mb-4">
            <div class="flex justify-between items-center">
              <span class="text-muted text-sm">Event</span>
              <span class="font-semibold text-ink text-sm text-right max-w-[60%]">${escapeHtml(event.title)}</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-muted text-sm">Name</span>
              <span class="font-semibold text-ink text-sm">${escapeHtml(profile?.full_name || 'Student')}</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-muted text-sm">Student ID</span>
              <span class="font-semibold text-ink text-sm font-mono">${escapeHtml(profile?.student_id || 'N/A')}</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-muted text-sm">Status</span>
              <span class="text-sm font-bold px-3 py-1 rounded-full ${isCheckedIn ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}">
                ${isCheckedIn ? '✅ Checked In' : '🎟️ Valid'}
              </span>
            </div>
          </div>

          <div class="flex gap-3">
            <button id="close-pass-btn" class="flex-1 border border-slate-200 text-ink font-semibold py-2.5 rounded-xl hover:bg-slate-50 transition text-sm">Close</button>
            <button id="download-pass-btn" class="flex-1 bg-brand-600 text-white font-bold py-2.5 rounded-xl hover:bg-brand-700 transition text-sm">⬇️ Download PNG</button>
          </div>
        </div>`);

      document.getElementById('close-pass-btn').addEventListener('click', closeModal);

      const qrContainer = document.getElementById('qr-code');
      const downloadButton = document.getElementById('download-pass-btn');
      try {
        if (typeof QRCode === 'undefined') throw new Error('QR code library did not load.');
        new QRCode(qrContainer, {
          text: rsvp.id,
          width: 200,
          height: 200,
          colorDark: '#0f172a',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M,
        });
      } catch (err) {
        const error = document.getElementById('qr-error');
        error.textContent = `Could not create your QR pass: ${err.message}`;
        error.classList.remove('hidden');
        downloadButton.disabled = true;
        downloadButton.classList.add('opacity-50', 'cursor-not-allowed');
      }

      // Download PNG
      downloadButton.addEventListener('click', () => {
        const canvas = qrContainer.querySelector('canvas');
        if (!canvas) {
          toast('The QR code is not ready to download.', 'error');
          return;
        }
        const link = document.createElement('a');
        link.download = `campusos-pass-${event.id.slice(0,8)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    init();
  </script>
</body>
</html>
