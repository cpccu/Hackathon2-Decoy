<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in – City University</title>
  <meta name="description" content="Sign in or create your City University account to access events and academic resources.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: {
        brand: { 50:'#eef4ff', 500:'#2563eb', 600:'#1d4ed8', 700:'#1e40af' },
        accent: '#f59e0b', ink: '#0f172a', muted: '#64748b', surface: '#f8fafc'
      },
      fontFamily: { sans: ['Inter','system-ui','sans-serif'] },
      animation: { 'scale-in': 'scaleIn 0.3s ease', 'slide-up': 'slideUp 0.3s ease' },
      keyframes: {
        scaleIn: { '0%':{ opacity:0, transform:'scale(0.95)' }, '100%':{ opacity:1, transform:'scale(1)' } },
        slideUp: { '0%':{ opacity:0, transform:'translateY(10px)' }, '100%':{ opacity:1, transform:'translateY(0)' } },
      }
    }}}
  </script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-brand-700 to-slate-900 flex items-center justify-center p-4">

  <!-- Background grid -->
  <div class="fixed inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZyBmaWxsPSJub25lIiBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxwYXRoIGQ9Ik0zNiAxOGMwLTkuOTQtOC4wNi0xOC0xOC0xOFMwIDguMDYgMCAxOHM4LjA2IDE4IDE4IDE4IDE4LTguMDYgMTgtMTh6IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9Ii4wMyIvPjwvZz48L3N2Zz4=')] opacity-30"></div>

  <div class="relative z-10 w-full max-w-md animate-scale-in">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="home.html" class="mx-auto inline-flex h-52 w-[22rem] items-center justify-center overflow-hidden rounded-[50%] border-4 border-[#b42332] bg-white p-6">
        <img src="CityUniLogo.jpeg" alt="City University" class="h-full w-full object-contain">
      </a>
      <p class="text-blue-200 mt-1 text-sm">City University Digital Hub</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
      <!-- Tabs -->
      <div class="flex border-b border-slate-100">
        <button id="tab-login" onclick="switchTab('login')"
          class="flex-1 py-4 text-sm font-bold text-brand-600 border-b-2 border-brand-600 transition-all" aria-selected="true">
          Sign In
        </button>
        <button id="tab-signup" onclick="switchTab('signup')"
          class="flex-1 py-4 text-sm font-bold text-muted border-b-2 border-transparent hover:text-ink transition-all" aria-selected="false">
          Create Account
        </button>
      </div>

      <!-- Login form -->
      <div id="panel-login" class="p-8 animate-slide-up">
        <h2 class="text-2xl font-extrabold text-ink mb-1">Welcome back!</h2>
        <p class="text-muted text-sm mb-6">Sign in to your account.</p>
        <form id="login-form" class="space-y-4" novalidate>
          <div>
            <label for="login-email" class="block text-xs font-semibold uppercase text-muted mb-1 tracking-wide">Email</label>
            <input id="login-email" type="email" placeholder="you@cityuniversity.edu.bd" autocomplete="email"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition text-sm">
            <p id="login-email-err" class="text-red-500 text-xs mt-1 hidden"></p>
          </div>
          <div>
            <label for="login-password" class="block text-xs font-semibold uppercase text-muted mb-1 tracking-wide">Password</label>
            <div class="relative">
              <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition text-sm pr-10">
              <button type="button" onclick="togglePw('login-password', 'eye-login')" class="absolute right-3 top-3.5 text-muted hover:text-ink" aria-label="Show password">
                <span id="eye-login">👁️</span>
              </button>
            </div>
            <p id="login-password-err" class="text-red-500 text-xs mt-1 hidden"></p>
          </div>
          <p id="login-error" class="text-red-500 text-sm bg-red-50 rounded-lg px-3 py-2 hidden"></p>
          <button id="login-btn" type="submit"
            class="w-full bg-brand-600 text-white font-bold py-3 rounded-xl hover:bg-brand-700 transition-all focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 flex items-center justify-center gap-2">
            Sign In
          </button>
        </form>
        <p class="text-center text-sm text-muted mt-4">
          No account? <button onclick="switchTab('signup')" class="text-brand-600 font-semibold hover:underline">Create one</button>
        </p>
      </div>

      <!-- Signup form -->
      <div id="panel-signup" class="p-8 hidden">
        <h2 class="text-2xl font-extrabold text-ink mb-1">Join City University</h2>
        <p class="text-muted text-sm mb-6">Create your account in seconds.</p>
        <form id="signup-form" class="space-y-4" novalidate>
          <div class="grid grid-cols-2 gap-3">
            <div class="col-span-2">
              <label for="su-name" class="block text-xs font-semibold uppercase text-muted mb-1 tracking-wide">Full Name</label>
              <input id="su-name" type="text" placeholder="Rafi Ahmed" autocomplete="name"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 transition text-sm">
              <p id="su-name-err" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>
            <div>
              <label for="su-sid" class="block text-xs font-semibold uppercase text-muted mb-1 tracking-wide">Student ID</label>
              <input id="su-sid" type="text" placeholder="CSE2201"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 transition text-sm">
            </div>
            <div>
              <label for="su-dept" class="block text-xs font-semibold uppercase text-muted mb-1 tracking-wide">Department</label>
              <select id="su-dept"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 transition text-sm bg-white">
                <option value="">Loading…</option>
              </select>
              <p id="su-dept-err" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>
          </div>
          <div>
            <label for="su-email" class="block text-xs font-semibold uppercase text-muted mb-1 tracking-wide">Email</label>
            <input id="su-email" type="email" placeholder="you@cityuniversity.edu.bd" autocomplete="email"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 transition text-sm">
            <p id="su-email-err" class="text-red-500 text-xs mt-1 hidden"></p>
          </div>
          <div>
            <label for="su-password" class="block text-xs font-semibold uppercase text-muted mb-1 tracking-wide">Password</label>
            <div class="relative">
              <input id="su-password" type="password" placeholder="Min 8 characters" autocomplete="new-password"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 transition text-sm pr-10">
              <button type="button" onclick="togglePw('su-password','eye-su')" class="absolute right-3 top-3.5 text-muted hover:text-ink" aria-label="Show password">
                <span id="eye-su">👁️</span>
              </button>
            </div>
            <p id="su-password-err" class="text-red-500 text-xs mt-1 hidden"></p>
          </div>
          <div>
            <label for="su-confirm" class="block text-xs font-semibold uppercase text-muted mb-1 tracking-wide">Confirm Password</label>
            <input id="su-confirm" type="password" placeholder="Repeat password" autocomplete="new-password"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 transition text-sm">
            <p id="su-confirm-err" class="text-red-500 text-xs mt-1 hidden"></p>
          </div>
          <p id="signup-error" class="text-red-500 text-sm bg-red-50 rounded-lg px-3 py-2 hidden"></p>
          <button id="signup-btn" type="submit"
            class="w-full bg-brand-600 text-white font-bold py-3 rounded-xl hover:bg-brand-700 transition-all focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 flex items-center justify-center gap-2">
            Create Account
          </button>
        </form>
        <p class="text-center text-sm text-muted mt-4">
          Already have an account? <button onclick="switchTab('login')" class="text-brand-600 font-semibold hover:underline">Sign in</button>
        </p>
      </div>

      <!-- Email confirmation panel -->
      <div id="panel-confirm" class="p-8 hidden text-center">
        <div class="text-5xl mb-4">📬</div>
        <h2 class="text-2xl font-extrabold text-ink mb-2">Check your inbox!</h2>
        <p class="text-muted mb-4">We sent a confirmation link to your email. Click it to activate your account, then sign in.</p>
        <button onclick="switchTab('login')" class="text-brand-600 font-semibold hover:underline text-sm">Back to Sign In</button>
      </div>
    </div>

  </div>

  <div id="toast-root" class="fixed bottom-4 right-4 z-[200] max-w-sm w-full"></div>

  <script type="module">
    import { signIn, signUp, getSession, listDepartments } from './js/api.js';
    import { toast } from './js/app.js';

    function getNextPage() {
      const next = new URLSearchParams(location.search).get('next');
      if (!next) return 'home.html';

      try {
        const url = new URL(next, location.origin);
        if (url.origin !== location.origin) return 'home.html';
        if (url.pathname === '/' || url.pathname === '/index.html') return 'home.html';
        return `${url.pathname}${url.search}${url.hash}`;
      } catch {
        return 'home.html';
      }
    }

    // Redirect if already logged in
    getSession().then(s => {
      if (s) {
        const next = getNextPage();
        location.href = next;
      }
    });

    // Load departments into signup select
    listDepartments().then(depts => {
      const sel = document.getElementById('su-dept');
      sel.innerHTML = '<option value="">Select department</option>' +
        depts.map(d => `<option value="${d.name}">${d.name}</option>`).join('');
    }).catch(() => {
      document.getElementById('su-dept').innerHTML = `
        <option value="">Select department</option>
        ${['CSE', 'EEE', 'BBA', 'English', 'Civil Engineering']
          .map(name => `<option value="${name}">${name}</option>`).join('')}`;
    });

    window.switchTab = (tab) => {
      ['login','signup'].forEach(t => {
        document.getElementById(`panel-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).classList.remove('text-brand-600','border-brand-600');
        document.getElementById(`tab-${t}`).classList.add('text-muted','border-transparent');
      });
      document.getElementById(`panel-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).classList.add('text-brand-600','border-brand-600');
      document.getElementById(`tab-${tab}`).classList.remove('text-muted','border-transparent');
    };

    window.togglePw = (inputId, eyeId) => {
      const inp = document.getElementById(inputId);
      inp.type = inp.type === 'password' ? 'text' : 'password';
    };

    function setLoading(btn, loading) {
      btn.disabled = loading;
      btn.innerHTML = loading
        ? '<svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Please wait…'
        : btn.dataset.label;
      if (!loading) btn.innerHTML = btn.dataset.label;
    }

    function showErr(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.toggle('hidden', !msg);
    }

    // Login
    const loginForm = document.getElementById('login-form');
    const loginBtn  = document.getElementById('login-btn');
    loginBtn.dataset.label = 'Sign In';

    loginForm.addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      let valid = true;
      showErr('login-email-err', ''); showErr('login-password-err', ''); showErr('login-error', '');
      if (!email)    { showErr('login-email-err', 'Email is required'); valid = false; }
      if (!password) { showErr('login-password-err', 'Password is required'); valid = false; }
      if (!valid) return;

      setLoading(loginBtn, true);
      try {
        await signIn(email, password);
        toast('Welcome back! 🎉', 'success');
        const next = getNextPage();
        setTimeout(() => location.href = next, 800);
      } catch (err) {
        showErr('login-error', err.message || 'Login failed. Check your credentials.');
      } finally {
        setLoading(loginBtn, false);
        loginBtn.innerHTML = loginBtn.dataset.label;
      }
    });

    // Signup
    const signupForm = document.getElementById('signup-form');
    const signupBtn  = document.getElementById('signup-btn');
    signupBtn.dataset.label = 'Create Account';

    signupForm.addEventListener('submit', async e => {
      e.preventDefault();
      const full_name  = document.getElementById('su-name').value.trim();
      const student_id = document.getElementById('su-sid').value.trim();
      const department = document.getElementById('su-dept').value;
      const email      = document.getElementById('su-email').value.trim();
      const password   = document.getElementById('su-password').value;
      const confirm    = document.getElementById('su-confirm').value;

      let valid = true;
      ['su-name-err','su-dept-err','su-email-err','su-password-err','su-confirm-err','signup-error'].forEach(id => showErr(id, ''));

      if (!full_name)              { showErr('su-name-err', 'Full name is required'); valid = false; }
      if (!department)             { showErr('su-dept-err', 'Select your department'); valid = false; }
      if (!email)                  { showErr('su-email-err', 'Email is required'); valid = false; }
      if (password.length < 8)     { showErr('su-password-err', 'Password must be at least 8 characters'); valid = false; }
      if (password !== confirm)    { showErr('su-confirm-err', 'Passwords do not match'); valid = false; }
      if (!valid) return;

      setLoading(signupBtn, true);
      try {
        const { needsConfirmation } = await signUp({ email, password, full_name, student_id, department });
        if (needsConfirmation) {
          ['login','signup'].forEach(t => document.getElementById(`panel-${t}`).classList.add('hidden'));
          document.getElementById('panel-confirm').classList.remove('hidden');
        } else {
          toast('Account created! 🎉', 'success');
          const next = getNextPage();
          setTimeout(() => location.href = next, 800);
        }
      } catch (err) {
        showErr('signup-error', err.message || 'Signup failed. Please try again.');
      } finally {
        setLoading(signupBtn, false);
        signupBtn.innerHTML = signupBtn.dataset.label;
      }
    });
  </script>
</body>
</html>
